# Project-scoped Codex config (loaded when this directory is trusted).
# Global defaults remain in ~/.codex/config.toml.

# Extra instruction filenames (AGENTS.md is always primary).
project_doc_fallback_filenames = [".agents.md"]

# Root AGENTS.md is the entry point; nested AGENTS.md/overrides still merge root→cwd.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Default workspace-write: edits under the repo; network off unless you enable it.
network_access = false

[shell_environment_policy]
# Minimal env forwarding for generated commands; expand only if a script needs more.
include_only = ["PATH", "HOME", "TMPDIR", "USER", "LANG"]
