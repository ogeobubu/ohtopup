<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1f2937" />
    <title>OhTopUp is offline</title>
    <style>
      body{margin:0;display:grid;min-height:100vh;place-items:center;background:#f4f6f8;color:#18232d;font-family:system-ui,sans-serif}.card{width:min(88vw,420px);padding:32px;border:1px solid #dfe4e8;border-radius:16px;background:#fff;text-align:center;box-shadow:0 12px 32px #12202c12}img{width:72px;height:72px;border-radius:16px}h1{margin:18px 0 8px;font-size:24px}p{margin:0 0 22px;color:#66717c;line-height:1.6}button{min-height:44px;padding:0 20px;border:0;border-radius:8px;color:#fff;background:#2458e9;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/fav-black.png" alt="OhTopUp" />
      <h1>You’re offline</h1>
      <p>Reconnect before making a payment or playing a wallet game. Financial actions are never queued on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
